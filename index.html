<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pordl Pitching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* VOICE everyday tool for baseball parents: calm, clear, trustworthy, used at the field on a phone
   IDEA a traffic light on the dugout wall: can he pitch today, and how much
   PICTURE large status card (green/amber/red) with the 14-day strip of outings beneath it
   COLOUR Pordl near-black ground; status colours green #2fd16f, amber #ffc531, red #ff5a4e; orange for actions
   TYPE Archivo display + Inter text
   LAYOUT phone first: pitcher switcher, status card, planner, tabs (Today, Log, Velo, Rules) */
:root{color-scheme:dark;--bg:#0d0f0e;--panel:#161a18;--panel2:#1d2220;--line:#2c3330;--ink:#f4f6f5;--mute:#a3ada8;--or:#ff6a13;--orD:#e65a07;--go:#2fd16f;--amb:#ffc531;--red:#ff5a4e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.05;letter-spacing:-.02em;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:16px 0 4px}
.mark{width:34px;height:34px;border-radius:50%;background:var(--or);color:#140800;display:grid;place-items:center;font:900 17px Archivo,sans-serif;flex:none}
header h1{font-size:22px;font-weight:900}
header small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.who{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.status{border-radius:18px;padding:20px;margin-top:10px;color:#07120b;position:relative;overflow:hidden}
.status.g{background:var(--go)}.status.y{background:var(--amb);color:#1d1400}.status.r{background:var(--red);color:#1e0503}
.status .nm{font-weight:700;font-size:15px;opacity:.8}
.status h2{font-size:clamp(40px,11vw,64px);font-weight:900;margin:4px 0 6px}
.status p{margin:0;font-weight:600;font-size:16px;max-width:46ch}
.status .why{margin-top:10px;font-weight:500;font-size:14px;opacity:.85}
.strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:16px}
.day{text-align:center;font-size:11px;font-weight:700}
.day b{display:block;height:44px;border-radius:7px;background:rgba(0,0,0,.14);position:relative;margin-bottom:3px}
.day b i{position:absolute;left:0;right:0;bottom:0;border-radius:7px;background:rgba(0,0,0,.6)}
.day b em{position:absolute;inset:auto 0 3px;font-style:normal;color:#fff;font-size:11px;font-weight:800}
.day.bp b{outline:2px dashed rgba(0,0,0,.45);outline-offset:-2px}
.day.today b{outline:2px solid rgba(0,0,0,.8);outline-offset:-2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.panel h3{font-size:18px;margin-bottom:10px}
.plan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.big{font:900 40px Archivo,sans-serif;color:var(--or);line-height:1;white-space:nowrap;text-align:right}
.big small{display:block;font:600 12px Inter,sans-serif;color:var(--mute);margin-top:4px}
label,.lab{display:block;font-size:13px;font-weight:700;color:var(--mute);margin:0 0 6px}
input,select{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;min-height:46px;padding:0 12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.st b{display:block;font:800 24px Archivo,sans-serif;white-space:nowrap}
.st span{font-size:12px;color:var(--mute);font-weight:600}
.meter{height:6px;background:var(--panel2);border-radius:4px;margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--or)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:20px;position:sticky;top:0;background:var(--bg);z-index:4;overflow-x:auto}
.tabs button{flex:none;min-height:48px;padding:0 16px;border:0;background:none;color:var(--mute);font:700 15px Inter,sans-serif;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--or)}
.pane{padding:14px 0 40px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:12px;border:0;background:var(--or);color:#140800;font:700 16px Inter,sans-serif;cursor:pointer}
.btn:hover{background:var(--orD)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{width:auto;min-height:38px;padding:0 12px;font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.form{display:grid;gap:12px}
.out{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.out .d{font:800 15px Archivo,sans-serif;line-height:1.15}.out .d small{display:block;font:500 12px Inter,sans-serif;color:var(--mute)}
.out .t{font-weight:600}.out .t small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.pill.rest{background:#202624;color:var(--mute)}.pill.pain{background:#3a0e0b;color:#ff9a92}.pill.sore{background:#3a2e06;color:var(--amb)}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;min-width:36px;min-height:36px}
.fig{position:relative;height:240px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.note{color:var(--mute);font-size:13px;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{color:var(--mute);font-size:12px}
td:first-child,th:first-child{text-align:left}
tr.me td{background:color-mix(in srgb,var(--or) 16%,transparent);font-weight:700}
.scroll{overflow-x:auto}
ul.rules{padding-left:18px;margin:10px 0}ul.rules li{margin:6px 0;color:#d6dcd9}
.warn{background:#3a0e0b;border:1px solid #6a1c16;color:#ffc1bb;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px}
.sample{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px dashed var(--mute);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mute);margin-top:10px}
.auth{max-width:440px;margin:0 auto;padding:40px 16px}
.auth h1{font-size:clamp(34px,8vw,46px);font-weight:900;margin:16px 0 8px}
.auth p.lede{color:var(--mute);margin:0 0 22px}
.auth .form{gap:14px}
.link{background:none;border:0;color:var(--mute);font:600 14px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:8px 0;min-height:40px}
.err{color:#ff9a92;font-size:14px;font-weight:600;min-height:1.2em;margin:0}
.sync{font-size:12px;color:var(--mute);margin-left:auto;white-space:nowrap}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.vcard .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.vcard video{width:100%;max-height:420px;border-radius:10px;background:#000;margin-top:10px}
.reply{background:var(--grBg,#0f3b22);border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap}
.reply b{display:block;color:#8df0b2;margin-bottom:4px}
textarea{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:110px;resize:vertical}
.pill.wait{background:#3a2e06;color:var(--amb)}.pill.done{background:#0f3b22;color:#8df0b2}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.work{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.work .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.work h3{font-size:24px;font-weight:900}
.work .sub{color:var(--mute);font-size:14px;font-weight:600}
.items{display:grid;gap:8px;margin-top:14px}
.it{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;background:var(--panel2);border-radius:10px;padding:10px 12px}
.it svg{width:40px;height:40px}
.it b{display:block}.it span{color:#c9d1cd;font-size:14px}
.chk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.chk>span{font-size:13px;font-weight:700;color:var(--mute);margin-right:4px}
.wk{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.wd{flex:none;width:96px;background:var(--panel2);border-radius:10px;padding:8px;font-size:12px}
.wd b{display:block;font-size:13px}.wd.now{outline:2px solid var(--or)}
.by{color:var(--mute);font-size:12px;margin-top:12px}
@media(max-width:420px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.st b{font-size:20px}.strip{gap:2px}.day{font-size:10px}}
@media(prefers-reduced-motion:no-preference){.status{transition:background .3s}}
</style>
</head>
<body>
<div class="auth" id="authBox" hidden></div>
<div class="wrap" id="appRoot" hidden>
  <header><div class="mark">P</div><div><h1>Pordl Pitching</h1><small>Arm care and workload, built by a former pro pitcher</small></div><span class="sync" id="sync"></span><button class="btn sm line" id="signOutTop" style="flex:none">Sign out</button></header>
  <div class="who" id="who"></div>
  <div id="sampleBar"></div>
  <div id="statusBox"></div>
  <div class="panel" id="planner"></div>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="pane" id="pane"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const KEY='pordlPitching1';
const RULES={'9-10':{max:75,t:[20,35,50,65]},'11-12':{max:85,t:[20,35,50,65]},'13-14':{max:95,t:[20,35,50,65]},'15-16':{max:95,t:[30,45,60,75]},'17-18':{max:105,t:[30,45,60,80]}};
const FEEL=[['great','Great'],['normal','Normal'],['sore','Sore'],['pain','Pain']];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dt=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const TODAY=iso(new Date());
const when=s=>{const n=diff(TODAY,s);return n===0||n===-1||n===1?nice(s):'on '+nice(s)};
const nice=s=>{const d=dt(s),n=diff(TODAY,s);return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':`${WD[d.getDay()]}, ${MN[d.getMonth()]} ${d.getDate()}`};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2000)};
const inn=x=>{const n=+x||0,w=Math.floor(n),f=Math.round((n-w)*10);return w+(f===1?1/3:f===2?2/3:0)};

function sample(){
  const a=uid(),b=uid();
  return {cur:a,tab:'today',sample:true,pitchers:[
   {id:a,name:'Jake',band:'15-16',role:'starter',season:'in',offs:[[add(TODAY,-300),add(TODAY,-210)]],teams:['High school','Travel team'],checks:{},
    outings:[
      {id:uid(),date:add(TODAY,-10),type:'game',team:'High school',p:81,ip:'5.2',feel:'normal'},
      {id:uid(),date:add(TODAY,-7),type:'pen',team:'',p:40,ip:'',feel:'great'},
      {id:uid(),date:add(TODAY,-3),type:'game',team:'Travel team',p:72,ip:'5.0',feel:'normal'}],
    velo:[[add(TODAY,-95),74,71],[add(TODAY,-78),75,72],[add(TODAY,-60),75,72],[add(TODAY,-41),77,73],[add(TODAY,-20),77,74],[add(TODAY,-3),78,75]],
    next:add(TODAY,3)},
   {id:b,name:'Luis',band:'13-14',role:'reliever',season:'in',teams:['Travel team'],checks:{},
    outings:[
      {id:uid(),date:add(TODAY,-4),type:'game',team:'Travel team',p:31,ip:'2.0',feel:'normal'},
      {id:uid(),date:add(TODAY,-1),type:'game',team:'Travel team',p:18,ip:'1.0',feel:'great'}],
    velo:[[add(TODAY,-40),68,65],[add(TODAY,-12),70,66]],next:add(TODAY,1)}]};
}
let S=null,USER=null,DEMO=false,saveT=null,ADMIN=false,WAITING=0,TIER='free',SUB=null,MYREVIEWS=0;
const LINKS={program:'https://buy.stripe.com/6oU7sL0so0UJgM8eDhdEs1n',pro:'https://buy.stripe.com/14AbJ15MI9rf2Vi0MrdEs1m',founding:'https://buy.stripe.com/fZu00j7UQ5aZgM8an1dEs1l'},PORTAL='https://billing.stripe.com/p/login/5kQ7sL5MIgTH9jGdzddEs00';
const hasProgram=()=>DEMO||ADMIN||TIER==='program'||TIER==='pro';
const hasPro=()=>DEMO||ADMIN||TIER==='pro';
async function loadPlan(){if(!USER||!sb)return;try{const {data}=await sb.from('subscriptions').select('*').eq('user_id',USER.id).maybeSingle();SUB=data||null;TIER=data&&['active','trialing'].includes(data.status)&&data.tier?data.tier:'free'}catch(e){TIER='free'}
  try{const m=new Date();const start=new Date(m.getFullYear(),m.getMonth(),1).toISOString();const q=await sb.from('reviews').select('id',{count:'exact',head:true}).eq('user_id',USER.id).gte('created_at',start);MYREVIEWS=q.count||0}catch(e){}}
const payUrl=k=>{const u=LINKS[k];if(!u||u.startsWith('__'))return '';return u+(u.includes('?')?'&':'?')+'client_reference_id='+encodeURIComponent(USER?USER.id:'')+(USER&&USER.email?'&prefilled_email='+encodeURIComponent(USER.email):'')};
function upsell(kind){const pro=kind==='pro';
  return `<div class="panel lock"><div class="sub" style="color:var(--or);font-weight:700">${pro?'Pordl Pitching Pro':'Pordl Pitching Program'}</div>
   <h3 style="font-size:22px;margin:4px 0 6px">${pro?'Get his delivery reviewed by Marcus':'Unlock Marcus\'s daily program'}</h3>
   <p style="margin:0;color:#d6dcd9">${pro?'Send a video of his pitching each month. Marcus McBeth, former pro pitcher and Cardinals scout, breaks it down: what he does well, what to fix, and the drills to fix it. Includes the full daily program.':'Every day, a plan for exactly where he is: recovery after starts, bullpen days, reliever readiness, ramp-up and off-season, plus the Thrower\'s Ten arm care routine.'}</p>
   <button class="btn" data-tab-go="plans" style="margin-top:12px">${pro?'See Pro: $49/month':'See plans: from $15/month'}</button></div>`}
function plansPane(){
  const cur=ADMIN?'Reviewer (all access)':TIER==='pro'?'Pro':TIER==='program'?'Program':'Free';
  const card=(k,name,price,items,cta,extra='')=>{const url=payUrl(k);const mine=(k==='program'&&TIER==='program')||((k==='pro'||k==='founding')&&TIER==='pro');
    return `<div class="panel" style="${k==='pro'?'border-color:var(--or)':''}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${name}</h3><b style="font:900 26px Archivo,sans-serif">${price}<small style="font:600 13px Inter;color:var(--mute)">/month</small></b></div>
     <ul class="rules">${items.map(i=>`<li>${i}</li>`).join('')}</ul>${extra}
     ${mine?'<p class="note" style="color:#8df0b2;font-weight:700">Your current plan</p>':(TIER!=='free'&&!ADMIN)?'<p class="note">To switch plans, use Manage subscription below.</p>':DEMO?'<p class="note">Create an account to subscribe.</p>':url?`<a class="btn" href="${esc(url)}" style="text-decoration:none">${cta}</a>`:'<p class="note">Coming soon.</p>'}</div>`};
  return `<h3 style="font-size:22px">Plans</h3><p class="note" style="margin-top:4px">Your plan: <b style="color:var(--ink)">${cur}</b>${SUB&&SUB.current_period_end&&TIER!=='free'?` · renews ${MN[new Date(SUB.current_period_end).getMonth()]} ${new Date(SUB.current_period_end).getDate()}`:''}</p>
   ${card('program','Program','$15',['Marcus\'s daily plan for starters and relievers','Ramp-up and off-season phases','Thrower\'s Ten arm care routine','Everything in Free'],'Start Program')}
   ${card('pro','Pro','$49',['One video review from Marcus every month','Breakdown of his delivery, with drills','Everything in Program'],'Start Pro',payUrl('founding')&&TIER==='free'?`<p class="note" style="color:#ffd9c2"><b>Founding member:</b> first 15 families get Pro for $39/month, locked in. <a href="${esc(payUrl('founding'))}" style="color:var(--or);font-weight:700">Claim a founding spot</a></p>`:'')}
   <div class="panel"><h3 style="margin:0 0 6px">Free</h3><ul class="rules"><li>Pitch counts, rest days and Pitch Smart limits</li><li>Can-he-pitch-today status and game planner</li><li>Arm check-ins, history and velocity log</li></ul></div>
   ${SUB&&!DEMO&&PORTAL&&!PORTAL.startsWith('__')?`<a class="btn line" href="${esc(PORTAL)}" style="text-decoration:none;margin-top:12px">Manage subscription (card, cancel)</a><p class="note">Sign in there with ${esc(USER.email)}.</p>`:''}
   ${!DEMO&&TIER==='free'?'<button class="btn line" id="refreshPlan" style="margin-top:12px">Paid? Tap to refresh your plan</button>':''}
   <p class="note">Cancel anytime. Payments are handled securely by Stripe.</p>`}

const sb=window.supabase?window.supabase.createClient('https://ohcwenpvwjgaaghltlql.supabase.co','sb_publishable_ECRIznw6p33rffna-NXp6w_M4c4GTu7'):null;
function migrate(){S.pitchers.forEach(p=>{p.role=p.role||'starter';p.season=['off','pre','build'].includes(p.season)?'ramp':(p.season||'in');if(p.season==='ramp'&&!p.rampStart)p.rampStart=TODAY;p.checks=p.checks||{};p.offs=p.offs||[];p.catcher=!!p.catcher;p.showVelo=!!p.showVelo});}
const blank=()=>({cur:null,tab:'add',sample:false,pitchers:[{id:uid(),name:'My pitcher',band:'13-14',role:'starter',season:'in',offs:[],catcher:false,checks:{},teams:['High school','Travel team'],outings:[],velo:[],next:add(TODAY,2)}]});
const setSync=t=>{const e=$('sync');if(e)e.textContent=t};
function save(){if(!S)return;if(DEMO){setSync('Demo · not saved');return}
  try{localStorage.setItem(KEY+':'+(USER?USER.id:'anon'),JSON.stringify(S))}catch(e){}
  if(!USER||!sb)return;clearTimeout(saveT);setSync('Saving…');
  saveT=setTimeout(async()=>{const {error}=await sb.from('app_state').upsert({user_id:USER.id,data:S,updated_at:new Date().toISOString()});setSync(error?'Not saved: '+(String(error.message||error.code||'check connection').slice(0,60)):'Saved')},800);}
async function loadUser(u){USER=u;DEMO=false;setSync('Loading…');
  let data=null;const {data:row,error}=await sb.from('app_state').select('data').eq('user_id',u.id).maybeSingle();
  if(error){try{data=JSON.parse(localStorage.getItem(KEY+':'+u.id))}catch(e){}toast('Couldn\'t reach the server. Showing what\'s saved on this device.')}else data=row&&row.data;
  S=data&&data.pitchers?data:blank();if(!S.cur)S.cur=S.pitchers[0].id;migrate();
  try{const r=await sb.rpc('is_admin');ADMIN=!!r.data;if(ADMIN){const q=await sb.from('reviews').select('id',{count:'exact',head:true}).eq('status','waiting');WAITING=q.count||0}}catch(e){ADMIN=false}
  await loadPlan();showApp();render();setSync('Saved');

const restFor=(band,n)=>{const t=RULES[band].t;let r=0;for(const x of t)if(n>x)r++;return r};

function plan(p,next){

   ${v.length?`<div style="margin-top:10px">${[...v].reverse().map(x=>`<div class="out" style="grid-template-columns:4.2em minmax(0,1fr) auto"><div class="d">${MN[dt(x[0]).getMonth()]} ${dt(x[0]).getDate()}</div><div class="t">${x[1]} mph top${x[2]?` · ${x[2]} avg`:''}</div><button class="x" data-vdel="${x[0]}|${x[1]}" aria-label="Delete reading">×</button></div>`).join('')}</div>`:''}`;
}
function drawVelo(){
  const s=$('vsvg');if(!s)return;
  const draw=()=>{const p=P(),v=[...p.velo].sort((a,b)=>a[0].localeCompare(b[0]));const W=s.clientWidth,H=s.clientHeight;
    if(v.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#a3ada8" font-size="14">Add two readings to see the trend</text>`;return}
    const ml=36,mr=16,mt=24,mb=26,t0=dt(v[0][0]).getTime(),t1=dt(v[v.length-1][0]).getTime()||t0+1;
    const lo=Math.floor((Math.min(...v.map(x=>x[2]||x[1]))-2)/2)*2,hi=Math.ceil((Math.max(...v.map(x=>x[1]))+2)/2)*2;
    const X=d=>ml+(dt(d).getTime()-t0)/(t1-t0||1)*(W-ml-mr),Y=y=>mt+(hi-y)/(hi-lo)*(H-mt-mb);
    let g='';for(let y=lo;y<=hi;y+=2)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(y)}" y2="${Y(y)}" stroke="#2c3330"/><text x="${ml-6}" y="${Y(y)+4}" text-anchor="end" fill="#a3ada8" font-size="12">${y}</text>`;
    const line=(k,c,w)=>{const pts=v.filter(x=>x[k]).map(x=>`${X(x[0])},${Y(x[k])}`);return pts.length>1?`<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`:''};
    const last=v[v.length-1];
    s.innerHTML=g+line(2,'#6b7570',2)+line(1,'#ff6a13',3)+v.map(x=>`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="4" fill="#ff6a13"/>`).join('')
      +`<text x="${Math.min(X(last[0]),W-mr)}" y="${Y(last[1])-10}" text-anchor="end" fill="#f4f6f5" font-size="14" font-weight="700">${last[1]} top</text>`
      +(last[2]?`<text x="${Math.min(X(last[0]),W-mr)}" y="${Y(last[2])+18}" text-anchor="end" fill="#a3ada8" font-size="12">${last[2]} avg</text>`:'')
      +`<text x="${ml}" y="${H-6}" fill="#a3ada8" font-size="12">${MN[dt(v[0][0]).getMonth()]} ${dt(v[0][0]).getDate()}</text><text x="${W-mr}" y="${H-6}" text-anchor="end" fill="#a3ada8" font-size="12">${MN[dt(last[0]).getMonth()]} ${dt(last[0]).getDate()}</text>`};
  if(drawVelo.ro)drawVelo.ro.disconnect();drawVelo.ro=new ResizeObserver(draw);drawVelo.ro.observe(s);draw();
}

  return `<div class="form"><h3 style="font-size:20px">${esc(p.name)}'s profile</h3>
   <div class="two"><div><label for="eName">Name</label><input id="eName" value="${esc(p.name)}"></div><div><label for="eBand">Age group</label><select id="eBand">${Object.keys(RULES).map(b=>`<option ${b===p.band?'selected':''}>${b}</option>`).join('')}</select></div></div>
   <div class="two"><div><label for="eRole">Role</label><select id="eRole"><option value="starter" ${p.role==='starter'?'selected':''}>Starter</option><option value="reliever" ${p.role==='reliever'?'selected':''}>Reliever</option></select></div><div><label for="eSeason">Season</label><select id="eSeason">${SEASONS.map(([k,n])=>`<option value="${k}" ${p.season===k?'selected':''}>${n}</option>`).join('')}</select></div></div>
   ${p.season==='ramp'?`<div><label for="eRamp">Ramp-up started (${RAMP(p).w} weeks for ages ${p.band})</label><input type="date" id="eRamp" value="${esc(p.rampStart||TODAY)}"></div>`:''}
   <label class="lab" style="display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px"><input type="checkbox" id="eCatch" ${p.catcher?'checked':''} style="width:22px;height:22px;min-height:0"> He also plays catcher</label>
   <div class="panel" style="margin-top:0"><h3 style="font-size:17px">Time off from throwing</h3>
   ${(()=>{const oi=offInfo(p);return oi.has?`<p class="note" style="margin-top:0">Longest stretch off in the last 12 months: <b style="color:var(--ink)">${oi.longest} days</b>. ASMI recommends 60–90 days straight, 120 preferred.</p>`:'<p class="note" style="margin-top:0">Nothing recorded yet.</p>'})()}
   ${(p.offs||[]).map((o,i)=>`<div class="out" style="grid-template-columns:minmax(0,1fr) auto"><div class="t">${MN[dt(o[0]).getMonth()]} ${dt(o[0]).getDate()}, ${dt(o[0]).getFullYear()} – ${MN[dt(o[1]).getMonth()]} ${dt(o[1]).getDate()}, ${dt(o[1]).getFullYear()}<small>${diff(o[0],o[1])} days</small></div><button class="x" data-offdel="${i}" aria-label="Delete time off">×</button></div>`).join('')}
   <div class="two" style="margin-top:10px"><div><label for="offA">Stopped throwing</label><input type="date" id="offA" max="${TODAY}"></div><div><label for="offB">Started again</label><input type="date" id="offB" max="${TODAY}"></div></div>
   <button class="btn line sm" id="addOff" type="button" style="margin-top:10px">Add time off</button></div>
   <div><label for="eTeams">Teams he pitches for (comma separated)</label><input id="eTeams" value="${esc(p.teams.join(', '))}"></div>
   <button class="btn line" id="saveP" type="button">Save profile</button>
   <h3 style="font-size:20px;margin-top:18px">Add another pitcher</h3>
   <div class="two"><div><label for="nName">Name</label><input id="nName" placeholder="e.g. Marcus Jr."></div><div><label for="nBand">Age group</label><select id="nBand">${Object.keys(RULES).map(b=>`<option ${b==='13-14'?'selected':''}>${b}</option>`).join('')}</select></div></div>
   <div class="two"><div><label for="nRole">Role</label><select id="nRole"><option value="starter">Starter</option><option value="reliever">Reliever</option></select></div><div><label for="nSeason">Season</label><select id="nSeason">${SEASONS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select></div></div>
   <div><label for="nTeams">Teams (comma separated)</label><input id="nTeams" placeholder="High school, Travel team"></div>
   <button class="btn" id="addP" type="button">Add pitcher</button>
   ${S.pitchers.length>1?`<button class="btn line" id="delP" type="button" style="color:#ff9a92">Remove ${esc(p.name)}</button>`:''}
   ${DEMO?'<p class="note">Demo mode: nothing is saved.</p><button class="btn" id="leaveDemo" type="button">Create a free account</button>':`<p class="note">Signed in as ${esc(USER?USER.email:'')}. Your data syncs to every device you sign in on.</p><button class="btn line" id="signOut" type="button">Sign out</button>`}</div>`;
}

/* ---------- events ---------- */
let oType='game',oFeel='normal';
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!S)return;const p=P();
  if(b.dataset.who){S.cur=b.dataset.who;render()}
  else if(b.dataset.tab||b.dataset.tabGo){S.tab=b.dataset.tab||b.dataset.tabGo;oType='game';oFeel='normal';render()}
  else if(b.dataset.otype){oType=b.dataset.otype;for(const c of document.querySelectorAll('[data-otype]'))c.setAttribute('aria-pressed',c===b);$('oIP').disabled=oType!=='game';$('oTeam').disabled=oType!=='game';$('oP').placeholder=oType==='warm'?'Warm-up pitches (optional)':'e.g. 45'}
  else if(b.dataset.feel){oFeel=b.dataset.feel;for(const c of document.querySelectorAll('[data-feel]'))c.setAttribute('aria-pressed',c===b)}
  else if(b.dataset.chk){p.checks[TODAY]=p.checks[TODAY]===b.dataset.chk?'':b.dataset.chk;render();toast(b.dataset.chk==='pain'?'Pain logged. Shut it down and get him checked.':'Saved')}
  else if(b.id==='addOff'){const a=$('offA').value,c=$('offB').value;if(!a||!c||c<=a){toast('Pick a start and an end date');return}p.offs.push([a,c]);p.offs.sort((x,y)=>x[0].localeCompare(y[0]));render();toast(`${diff(a,c)} days off added`)}
  else if(b.dataset.offdel){p.offs.splice(+b.dataset.offdel,1);render()}
  else if(b.id==='showVelo'){p.showVelo=true;render()}
  else if(b.id==='signOut'||b.id==='signOutTop'){if(DEMO){DEMO=false;S=null;authView('in');return}sb.auth.signOut();S=null;USER=null;authView('in')}
  else if(b.id==='leaveDemo'){DEMO=false;S=null;authView('up')}
  else if(b.dataset.del){p.outings=p.outings.filter(o=>o.id!==b.dataset.del);render();toast('Outing deleted')}
  else if(b.dataset.vdel){const [d,mx]=b.dataset.vdel.split('|');const i=p.velo.findIndex(x=>x[0]===d&&String(x[1])===mx);if(i>-1)p.velo.splice(i,1);render()}
  else if(b.id==='clearSample'){S={cur:null,tab:'add',sample:false,pitchers:[{id:uid(),name:'My pitcher',band:'13-14',role:'starter',season:'in',offs:[],catcher:false,checks:{},teams:['High school','Travel team'],outings:[],velo:[],next:add(TODAY,2)}]};S.cur=S.pitchers[0].id;render();toast('Fresh start. Set up his profile.')}
  else if(b.id==='saveP'){p.name=$('eName').value.trim()||p.name;p.band=$('eBand').value;p.role=$('eRole').value;{const ns=$('eSeason').value;if(ns==='shut'&&p.season!=='shut')p.shutStart=TODAY;if(ns==='ramp'&&p.season!=='ramp')p.rampStart=TODAY;if(p.season==='shut'&&ns!=='shut'&&p.shutStart){if(diff(p.shutStart,TODAY)>0)p.offs.push([p.shutStart,TODAY]);p.shutStart=null}p.season=ns}p.catcher=$('eCatch').checked;if($('eRamp')&&$('eRamp').value&&p.season==='ramp')p.rampStart=$('eRamp').value;p.teams=$('eTeams').value.split(',').map(s=>s.trim()).filter(Boolean);if(!p.teams.length)p.teams=['Team'];render();toast('Profile saved')}
  else if(b.id==='addP'){const n=$('nName').value.trim();if(!n){toast('Enter a name');$('nName').focus();return}const np={id:uid(),name:n,band:$('nBand').value,role:$('nRole').value,season:$('nSeason').value,shutStart:$('nSeason').value==='shut'?TODAY:null,rampStart:$('nSeason').value==='ramp'?TODAY:null,offs:[],catcher:false,checks:{},teams:$('nTeams').value.split(',').map(s=>s.trim()).filter(Boolean),outings:[],velo:[],next:add(TODAY,2)};if(!np.teams.length)np.teams=['Team'];S.pitchers.push(np);S.cur=np.id;S.tab='today';render();toast(`${n} added`)}
  else if(b.id==='delP'){S.pitchers=S.pitchers.filter(x=>x.id!==p.id);S.cur=S.pitchers[0].id;render()}
});
document.addEventListener('change',e=>{if(e.target.id==='nextG'){P().next=e.target.value;render()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const p=P();
  if(e.target.id==='fOut'){
    const d=$('oDate').value,n=parseInt($('oP').value,10),ip=$('oIP').value.trim();
    if(!d||d>TODAY){toast('Pick a date up to today');return}
    if(oType!=='warm'&&!(n>0&&n<=200)){toast('Enter the pitch count');$('oP').focus();return}
    if(oType==='game'&&ip&&!/^\d{1,2}(\.[012])?$/.test(ip)){toast('Innings like 3, 3.1 or 3.2');$('oIP').focus();return}
    p.outings.push({id:uid(),date:d,type:oType,team:oType==='game'?$('oTeam').value:'',p:n||0,ip:oType==='game'?ip:'',feel:oFeel});
    const R=RULES[p.band],wasGame=oType==='game';S.tab='today';oType='game';oFeel='normal';render();scrollTo({top:0,behavior:'smooth'});
    toast(n>R.max&&wasGame?`Saved. ${n} is over the ${R.max} daily max for ages ${p.band}.`:'Outing saved');
  }else if(e.target.id==='fVelo'){
    const d=$('vD').value,mx=parseInt($('vMax').value,10),av=parseInt($('vAvg').value,10)||0;
    if(!d||!(mx>=30&&mx<=105)){toast('Enter a top velo between 30 and 105');return}
    p.velo.push([d,mx,av&&av<=mx?av:0]);render();toast('Reading added');
  }
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.auth)authView(b.dataset.auth);
  else if(b.id==='demoBtn'){DEMO=true;USER=null;S=sample();migrate();showApp();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='authF'){e.preventDefault();e.stopPropagation();authSubmit()}},true);
(async()=>{
  if(!sb){authView('in','Couldn\'t load the sign-in service. Check your connection and reload.');return}
  sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='PASSWORD_RECOVERY')authView('newpw')});
  const {data}=await sb.auth.getSession();
  if(location.hash.includes('type=recovery'))return;
  if(data.session)loadUser(data.session.user);else authView('in');
})();
}
</script>
</body>
</html>
