name: Keep Supabase awake

# Supabase pauses free projects after about a week with no activity.
# This pings the database every 2 days so Pordl Pitching stays live.
on:
  schedule:
    - cron: "17 15 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o -m1 'https://[a-z0-9]*\.supabase\.co' index.html | head -1)
          KEY=$(grep -o -m1 'sb_publishable_[A-Za-z0-9_-]*' index.html | head -1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/app_state?select=*&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $CODE"
          test "$CODE" -lt 500
